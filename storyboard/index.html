<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyboard — Jake Goldwasser</title>
<meta name="description" content="A 14-spread grid for drafting picture book text and illustration notes.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root {
    --paper: #F5FAFB;
    --surface: #FFFFFF;
    --surface-2: #E7F5F3;
    --ink: #163240;
    --ink-soft: #4F7480;
    --ink-faint: #93AFB6;
    --line: #D7E8EA;
    --line-strong: #A9CCD0;
    --accent: #1E4FDB;
    --accent-ink: #FFFFFF;
    --accent-soft: #DEE6FC;
    --teal: #00A99A;
    --danger: #BD5138;
    --danger-soft: #FAEAE4;
    --shadow: rgba(20, 45, 56, 0.08);
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
    padding: 40px clamp(16px, 4vw, 56px) 80px;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---- Header ---- */

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 360px;
    min-width: 0;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  #title-input {
    font-family: "EB Garamond", ui-serif, Georgia, serif;
    font-weight: 500;
    font-size: clamp(30px, 4vw, 44px);
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line-strong);
    padding: 2px 2px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #title-input::placeholder { color: var(--ink-faint); }
  #title-input:focus { border-bottom-color: var(--accent); }

  .meta-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .spread-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .spread-count strong {
    color: var(--ink);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .save-status {
    font-size: 11px;
    color: var(--ink-faint);
    height: 14px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .save-status.visible { opacity: 1; }

  /* ---- Sheet ---- */

  .sheet-scroll {
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .sheet {
    display: grid;
    grid-template-columns: 64px minmax(340px, 2fr) minmax(220px, 1fr);
    gap: 10px;
    min-width: 680px;
  }

  .col-head {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 0 4px 6px;
    align-self: end;
  }

  .col-head.head-num { text-align: center; }

  .col-head-pair {
    display: flex;
    padding: 0;
  }

  .col-head-pair span {
    flex: 1 1 50%;
    padding: 0 4px 6px 14px;
  }

  /* spread number */

  .num-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
    cursor: grab;
    user-select: none;
    border-radius: var(--radius);
    transition: background-color 0.12s ease;
  }

  .num-cell:hover { background: var(--surface-2); }
  .num-cell.dragging { opacity: 0.35; }
  .num-cell:active { cursor: grabbing; }

  .num-cell .n { font-size: 28px; }

  .num-cell .remove-row {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--danger);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .num-cell:hover .remove-row { display: flex; }
  .num-cell .remove-row:hover { background: var(--danger-soft); }

  /* insert-spread gaps between rows */

  .row-gap {
    grid-column: 1 / -1;
    position: relative;
    height: 8px;
    cursor: pointer;
    z-index: 1;
  }

  .row-gap::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.12s ease, background-color 0.12s ease;
  }

  .row-gap .insert-pill {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 999px;
    padding: 3px 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }

  .row-gap:hover::before,
  .row-gap.drag-target::before { opacity: 1; }

  .row-gap:hover .insert-pill,
  .row-gap.drag-target .insert-pill { opacity: 1; }

  .row-gap.drag-target::before {
    background: var(--teal);
    height: 3px;
  }

  .row-gap.drag-target .insert-pill { background: var(--teal); }

  textarea.cell {
    font-family: "EB Garamond", ui-serif, Georgia, serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 12px 14px;
    resize: none;
    overflow: hidden;
    min-height: 64px;
    width: 100%;
    box-shadow: 0 1px 2px var(--shadow);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea.cell::placeholder { color: var(--ink-faint); }

  textarea.cell:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  textarea.illustration {
    background: var(--surface-2);
    color: var(--ink-soft);
  }

  textarea.illustration:focus { color: var(--ink); }

  /* verso + recto: one connected unit, split only by a dotted rule */

  .spread-pair {
    display: flex;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px var(--shadow);
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .spread-pair:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .pair-side {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .spread-pair textarea.cell {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .spread-pair textarea.cell:focus {
    box-shadow: none;
  }

  .pair-divider {
    align-self: stretch;
    width: 3px;
    flex: none;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--line-strong) 0,
      var(--line-strong) 10px,
      transparent 10px,
      transparent 17px
    );
  }

  .pair-divider-h {
    flex: none;
    height: 3px;
    background-image: repeating-linear-gradient(
      to right,
      var(--line-strong) 0,
      var(--line-strong) 10px,
      transparent 10px,
      transparent 17px
    );
  }

  .split-toggle {
    position: absolute;
    top: 4px;
    right: 4px;
    font-family: "Poppins", sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 2px 9px;
    cursor: pointer;
    opacity: 0;
    z-index: 2;
    transition: opacity 0.12s ease, background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .pair-side:hover .split-toggle,
  .split-toggle:focus-visible { opacity: 1; }

  .split-toggle:hover {
    background: var(--surface-2);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ---- Footer / add row ---- */

  .sheet-footer {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }

  .add-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 11px 20px 11px 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .add-row:hover { box-shadow: 0 4px 10px var(--shadow); transform: translateY(-1px); }
  .add-row:active { transform: translateY(0); }
  .add-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .add-row .plus {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    font-size: 13px;
    line-height: 1;
  }

  .export-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease, color 0.12s ease;
  }

  .export-btn:hover { background: var(--surface-2); }
  .export-btn:disabled { opacity: 0.6; cursor: default; }
  .export-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .export-btn[aria-expanded="true"] { background: var(--surface-2); }

  .export-menu {
    position: relative;
  }

  .export-panel {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    width: 200px;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px var(--shadow);
    padding: 8px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .export-panel[hidden] { display: none; }

  .export-option-btn {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 4px;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
  }

  .export-option-btn:hover { background: var(--surface-2); }
  .export-option-btn:disabled { opacity: 0.6; cursor: default; }
  .export-option-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .export-option-btn .ext {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-faint);
  }

  .format-toggle {
    display: flex;
    gap: 6px;
  }

  .format-toggle button {
    flex: 1;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--paper);
    border: 2px solid var(--line-strong);
    border-radius: 999px;
    padding: 6px 8px;
    cursor: pointer;
  }

  .format-toggle button.active {
    color: var(--accent-ink);
    background: var(--teal);
    border-color: var(--teal);
  }

  .export-status {
    font-size: 12px;
    color: var(--ink-soft);
    max-width: 320px;
  }

  .trim-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .trim-select {
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .trim-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- My Storyboards menu ---- */

  .library-menu {
    position: relative;
  }

  .library-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }

  .library-btn:hover,
  .library-btn[aria-expanded="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }

  .library-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .library-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 270px;
    max-width: 80vw;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px var(--shadow);
    padding: 10px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .library-panel[hidden] { display: none; }

  .new-storyboard-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .new-storyboard-btn:hover { opacity: 0.9; }
  .new-storyboard-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .library-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 260px;
    overflow-y: auto;
  }

  .library-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    color: var(--ink);
  }

  .library-entry:hover { background: var(--surface-2); }

  .library-entry.current {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    cursor: default;
  }

  .library-entry-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .library-entry-delete {
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--danger);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .library-entry:hover .library-entry-delete { display: flex; }
  .library-entry-delete:hover { background: var(--danger-soft); }

  .library-empty {
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    padding: 12px 4px;
  }

  .save-library-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .save-library-btn:hover { background: var(--accent-soft); }
  .save-library-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .clear-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }

  .clear-btn:hover { background: var(--danger-soft); border-color: var(--danger); }
  .clear-btn:focus-visible { outline: 2px solid var(--danger); outline-offset: 3px; }

  /* ---- Email storyboard ---- */

  .email-menu {
    position: relative;
  }

  .email-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .email-btn:hover,
  .email-btn[aria-expanded="true"] { background: var(--surface-2); }
  .email-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  .email-panel {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    width: 260px;
    max-width: 80vw;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px var(--shadow);
    padding: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .email-panel[hidden] { display: none; }

  .email-panel-label {
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .email-panel input[type="email"] {
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 10px;
    width: 100%;
  }

  .email-panel input[type="email"]:focus {
    outline: none;
    border-color: var(--teal);
  }

  .email-send-btn {
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--teal);
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .email-send-btn:hover { opacity: 0.9; }
  .email-send-btn:disabled { opacity: 0.6; cursor: default; }

  .email-panel-status {
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <div class="title-block">
      <span class="eyebrow">Picture Book Manuscript</span>
      <input id="title-input" type="text" placeholder="Untitled Picture Book" autocomplete="off" />
    </div>
    <div class="meta-panel">
      <div class="library-menu" id="library-menu">
        <button class="library-btn" id="library-btn" type="button" aria-expanded="false">My Storyboards ▾</button>
        <div class="library-panel" id="library-panel" hidden>
          <button class="new-storyboard-btn" id="new-storyboard-btn" type="button">+ New Storyboard</button>
          <div class="library-list" id="library-list"></div>
        </div>
      </div>
      <span class="spread-count"><strong id="spread-total">14</strong> spreads</span>
      <span class="save-status" id="save-status">Saved</span>
    </div>
  </header>

  <div class="sheet-scroll">
    <div class="sheet" id="sheet">
      <span class="col-head head-num">Spread</span>
      <div class="col-head col-head-pair">
        <span>Verso Text</span>
        <span>Recto Text</span>
      </div>
      <span class="col-head">Illustration</span>
      <!-- rows injected here -->
    </div>
  </div>

  <div class="sheet-footer">
    <button class="add-row" id="add-row-btn" type="button">
      <span class="plus">+</span>
      Add Spread
    </button>
    <label class="trim-label" for="trim-select">
      Book size
      <select id="trim-select" class="trim-select"></select>
    </label>
    <div class="export-menu" id="export-menu">
      <button class="export-btn" id="export-btn" type="button" aria-expanded="false">Export As…</button>
      <div class="export-panel" id="export-panel" hidden>
        <button class="export-option-btn" id="export-pptx-btn" type="button">PowerPoint <span class="ext">.pptx</span></button>
        <button class="export-option-btn" id="export-pdf-btn" type="button">PDF <span class="ext">.pdf</span></button>
      </div>
    </div>
    <div class="email-menu" id="email-menu">
      <button class="email-btn" id="email-btn" type="button" aria-expanded="false">Email As…</button>
      <div class="email-panel" id="email-panel" hidden>
        <div class="format-toggle" id="email-format-toggle">
          <button type="button" class="active" data-format="pptx">PowerPoint</button>
          <button type="button" data-format="pdf">PDF</button>
        </div>
        <label class="email-panel-label" for="email-addr">Send to</label>
        <input type="email" id="email-addr" placeholder="you@example.com" required />
        <button class="email-send-btn" id="email-send-btn" type="button">Send</button>
        <p class="email-panel-status" id="email-panel-status"></p>
      </div>
    </div>
    <button class="save-library-btn" id="save-library-btn" type="button">
      Save to My Storyboards
    </button>
    <button class="clear-btn" id="clear-btn" type="button">
      Clear Storyboard
    </button>
    <span class="export-status" id="export-status"></span>
  </div>
</div>

<script>
  (function () {
    var STORAGE_KEY = 'book-dummy-script-v1';
    var INDEX_KEY = 'book-dummy-index-v1';
    var STORY_PREFIX = 'book-dummy-story-';
    var CURRENT_KEY = 'book-dummy-current-v1';
    var INITIAL_ROWS = 14;
    var currentId = null;
    var sheetEl = document.getElementById('sheet');
    var titleEl = document.getElementById('title-input');
    var addBtn = document.getElementById('add-row-btn');
    var totalEl = document.getElementById('spread-total');
    var statusEl = document.getElementById('save-status');
    var draggedIndex = null;

    var TRIM_SIZES = [
      { key: '8.5x8.5', label: '8.5" × 8.5" (Square)', pageW: 8.5, pageH: 8.5 },
      { key: '8x8', label: '8" × 8" (Square)', pageW: 8, pageH: 8 },
      { key: '8.5x11', label: '8.5" × 11" (Portrait)', pageW: 8.5, pageH: 11 },
      { key: '8x10', label: '8" × 10" (Portrait)', pageW: 8, pageH: 10 },
      { key: '10x8', label: '10" × 8" (Landscape)', pageW: 10, pageH: 8 },
      { key: '11x8.5', label: '11" × 8.5" (Landscape)', pageW: 11, pageH: 8.5 }
    ];
    var DEFAULT_TRIM = '8.5x8.5';

    function getTrimSize(key) {
      for (var i = 0; i < TRIM_SIZES.length; i++) {
        if (TRIM_SIZES[i].key === key) return TRIM_SIZES[i];
      }
      return TRIM_SIZES[0];
    }

    var state = { title: '', rows: [], trimSize: DEFAULT_TRIM };

    function blankRow() {
      return { verso: '', verso2: '', versoSplit: false, recto: '', recto2: '', rectoSplit: false, illustration: '' };
    }

    function normalizeRow(row) {
      row = row || {};
      return {
        verso: row.verso || '',
        verso2: row.verso2 || '',
        versoSplit: !!row.versoSplit,
        recto: row.recto || '',
        recto2: row.recto2 || '',
        rectoSplit: !!row.rectoSplit,
        illustration: row.illustration || ''
      };
    }

    function defaultRows() {
      var rows = [];
      for (var i = 0; i < INITIAL_ROWS; i++) rows.push(blankRow());
      return rows;
    }

    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function loadIndex() {
      try {
        var raw = localStorage.getItem(INDEX_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }

    function saveIndex(list) {
      try { localStorage.setItem(INDEX_KEY, JSON.stringify(list)); } catch (e) {}
    }

    function upsertIndexEntry(id, title) {
      var list = loadIndex();
      var found = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) { found = list[i]; break; }
      }
      var displayTitle = title && title.trim() ? title.trim() : 'Untitled Picture Book';
      if (found) {
        found.title = displayTitle;
        found.updatedAt = Date.now();
      } else {
        list.push({ id: id, title: displayTitle, updatedAt: Date.now() });
      }
      saveIndex(list);
    }

    function removeIndexEntry(id) {
      var list = loadIndex().filter(function (e) { return e.id !== id; });
      saveIndex(list);
      try { localStorage.removeItem(STORY_PREFIX + id); } catch (e) {}
    }

    function loadStory(id) {
      try {
        var raw = localStorage.getItem(STORY_PREFIX + id);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        return {
          title: parsed.title || '',
          rows: Array.isArray(parsed.rows) && parsed.rows.length ? parsed.rows.map(normalizeRow) : defaultRows(),
          trimSize: getTrimSize(parsed.trimSize).key
        };
      } catch (e) { return null; }
    }

    function saveStory(id, data) {
      try { localStorage.setItem(STORY_PREFIX + id, JSON.stringify(data)); } catch (e) {}
    }

    function initLibrary() {
      var savedCurrent = null;
      try { savedCurrent = localStorage.getItem(CURRENT_KEY); } catch (e) {}

      if (savedCurrent) {
        var existing = loadStory(savedCurrent);
        if (existing) {
          currentId = savedCurrent;
          state.title = existing.title;
          state.rows = existing.rows;
          state.trimSize = existing.trimSize;
          return;
        }
      }

      // First run, or the pointed-to story vanished: migrate the old
      // single-storyboard data if present, otherwise start fresh.
      var legacy = null;
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) legacy = JSON.parse(raw);
      } catch (e) {}

      currentId = makeId();
      if (legacy && Array.isArray(legacy.rows) && legacy.rows.length) {
        state.title = legacy.title || '';
        state.rows = legacy.rows.map(normalizeRow);
        state.trimSize = getTrimSize(legacy.trimSize).key;
      } else {
        state.title = '';
        state.rows = defaultRows();
        state.trimSize = DEFAULT_TRIM;
      }

      saveStory(currentId, { title: state.title, rows: state.rows, trimSize: state.trimSize });
      upsertIndexEntry(currentId, state.title);
      try { localStorage.setItem(CURRENT_KEY, currentId); } catch (e) {}
    }

    var saveTimer = null;
    function save() {
      try {
        saveStory(currentId, { title: state.title, rows: state.rows, trimSize: state.trimSize });
        upsertIndexEntry(currentId, state.title);
      } catch (e) {}
      statusEl.textContent = 'Saved';
      statusEl.classList.add('visible');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        statusEl.classList.remove('visible');
      }, 1500);
    }

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function makeTextarea(field, rowIndex, placeholder, extraClass) {
      var ta = document.createElement('textarea');
      ta.className = 'cell' + (extraClass ? ' ' + extraClass : '');
      ta.placeholder = placeholder;
      ta.value = state.rows[rowIndex][field] || '';
      ta.setAttribute('aria-label', placeholder + ' — spread ' + (rowIndex + 1));
      ta.addEventListener('input', function () {
        state.rows[rowIndex][field] = ta.value;
        autoGrow(ta);
        save();
      });
      requestAnimationFrame(function () { autoGrow(ta); });
      return ta;
    }

    function toggleSplit(rowIndex, prefix) {
      var row = state.rows[rowIndex];
      var splitField = prefix + 'Split';
      var field2 = prefix + '2';
      if (row[splitField]) {
        row[prefix] = row[field2] ? (row[prefix] ? row[prefix] + '\n\n' + row[field2] : row[field2]) : row[prefix];
        row[field2] = '';
        row[splitField] = false;
      } else {
        row[splitField] = true;
      }
      save();
      render();
    }

    function makeSide(rowIndex, prefix, label) {
      var row = state.rows[rowIndex];
      var splitField = prefix + 'Split';
      var field2 = prefix + '2';

      var side = document.createElement('div');
      side.className = 'pair-side';

      side.appendChild(makeTextarea(prefix, rowIndex, label));
      if (row[splitField]) {
        var hDivider = document.createElement('div');
        hDivider.className = 'pair-divider-h';
        side.appendChild(hDivider);
        side.appendChild(makeTextarea(field2, rowIndex, label + ', continued'));
      }

      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'split-toggle';
      toggle.textContent = row[splitField] ? 'Merge' : 'Split';
      toggle.setAttribute('aria-label', (row[splitField] ? 'Merge ' : 'Split ') + label.toLowerCase() + ' — spread ' + (rowIndex + 1));
      toggle.addEventListener('click', function () {
        toggleSplit(rowIndex, prefix);
      });
      side.appendChild(toggle);

      return side;
    }

    function makeRowGap(gapIndex) {
      var gap = document.createElement('div');
      gap.className = 'row-gap';

      var pill = document.createElement('span');
      pill.className = 'insert-pill';
      pill.textContent = '+ Add spread';
      gap.appendChild(pill);

      gap.addEventListener('click', function () {
        insertRowAt(gapIndex);
      });

      gap.addEventListener('dragover', function (e) {
        if (draggedIndex === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        gap.classList.add('drag-target');
      });
      gap.addEventListener('dragleave', function () {
        gap.classList.remove('drag-target');
      });
      gap.addEventListener('drop', function (e) {
        e.preventDefault();
        gap.classList.remove('drag-target');
        if (draggedIndex === null) return;
        moveRow(draggedIndex, gapIndex);
        draggedIndex = null;
      });

      return gap;
    }

    function insertRowAt(gapIndex) {
      state.rows.splice(gapIndex, 0, blankRow());
      save();
      render();
      var textareas = sheetEl.querySelectorAll('textarea.cell');
      var target = textareas[gapIndex * 3];
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.focus();
      }
    }

    function moveRow(from, to) {
      if (to > from) to -= 1;
      if (to === from) return;
      var row = state.rows.splice(from, 1)[0];
      state.rows.splice(to, 0, row);
      save();
      render();
    }

    function render() {
      var nodes = sheetEl.querySelectorAll('.num-cell, .spread-pair, textarea.cell, .row-gap');
      nodes.forEach(function (n) { n.remove(); });

      sheetEl.appendChild(makeRowGap(0));

      state.rows.forEach(function (row, i) {
        var num = document.createElement('div');
        num.className = 'num-cell';
        num.draggable = true;
        var n = document.createElement('span');
        n.className = 'n';
        n.textContent = i + 1;
        num.appendChild(n);
        if (state.rows.length > 1) {
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'remove-row';
          del.draggable = false;
          del.setAttribute('aria-label', 'Delete spread ' + (i + 1));
          del.textContent = '×';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            state.rows.splice(i, 1);
            save();
            render();
          });
          num.appendChild(del);
        }
        num.addEventListener('dragstart', function (e) {
          draggedIndex = i;
          num.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {}
        });
        num.addEventListener('dragend', function () {
          num.classList.remove('dragging');
          draggedIndex = null;
        });
        sheetEl.appendChild(num);

        var divider = document.createElement('div');
        divider.className = 'pair-divider';

        var pair = document.createElement('div');
        pair.className = 'spread-pair';
        pair.appendChild(makeSide(i, 'verso', 'Verso text'));
        pair.appendChild(divider);
        pair.appendChild(makeSide(i, 'recto', 'Recto text'));
        sheetEl.appendChild(pair);

        sheetEl.appendChild(makeTextarea('illustration', i, 'Illustration notes', 'illustration'));

        sheetEl.appendChild(makeRowGap(i + 1));
      });

      totalEl.textContent = state.rows.length;
    }

    titleEl.addEventListener('input', function () {
      state.title = titleEl.value;
      save();
    });

    addBtn.addEventListener('click', function () {
      insertRowAt(state.rows.length);
    });

    initLibrary();
    titleEl.value = state.title;
    render();

    var trimSelect = document.getElementById('trim-select');
    TRIM_SIZES.forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.key;
      opt.textContent = t.label;
      trimSelect.appendChild(opt);
    });
    trimSelect.value = state.trimSize;
    trimSelect.addEventListener('change', function () {
      state.trimSize = trimSelect.value;
      save();
    });

    // ---- My Storyboards library ----

    var libraryMenu = document.getElementById('library-menu');
    var libraryBtn = document.getElementById('library-btn');
    var libraryPanel = document.getElementById('library-panel');
    var libraryList = document.getElementById('library-list');
    var newStoryboardBtn = document.getElementById('new-storyboard-btn');
    var saveLibraryBtn = document.getElementById('save-library-btn');

    function renderLibraryList() {
      var list = loadIndex().slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      libraryList.innerHTML = '';
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'library-empty';
        empty.textContent = 'No saved storyboards yet.';
        libraryList.appendChild(empty);
        return;
      }
      list.forEach(function (entry) {
        var item = document.createElement('div');
        item.className = 'library-entry' + (entry.id === currentId ? ' current' : '');

        var titleSpan = document.createElement('span');
        titleSpan.className = 'library-entry-title';
        titleSpan.textContent = entry.title;
        item.appendChild(titleSpan);

        if (entry.id !== currentId) {
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'library-entry-delete';
          del.draggable = false;
          del.setAttribute('aria-label', 'Delete "' + entry.title + '"');
          del.textContent = '×';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            if (window.confirm('Delete "' + entry.title + '"? This can\'t be undone.')) {
              removeIndexEntry(entry.id);
              renderLibraryList();
            }
          });
          item.appendChild(del);
          item.addEventListener('click', function () { switchTo(entry.id); });
        }

        libraryList.appendChild(item);
      });
    }

    function openLibraryPanel() {
      renderLibraryList();
      libraryPanel.hidden = false;
      libraryBtn.setAttribute('aria-expanded', 'true');
    }

    function closeLibraryPanel() {
      libraryPanel.hidden = true;
      libraryBtn.setAttribute('aria-expanded', 'false');
    }

    function switchTo(id) {
      if (id === currentId) { closeLibraryPanel(); return; }
      save();
      var data = loadStory(id);
      if (!data) return;
      currentId = id;
      try { localStorage.setItem(CURRENT_KEY, currentId); } catch (e) {}
      state.title = data.title;
      state.rows = data.rows;
      state.trimSize = data.trimSize;
      titleEl.value = state.title;
      trimSelect.value = state.trimSize;
      render();
      closeLibraryPanel();
    }

    function createNewStoryboard() {
      save();
      currentId = makeId();
      try { localStorage.setItem(CURRENT_KEY, currentId); } catch (e) {}
      state.title = '';
      state.rows = defaultRows();
      state.trimSize = DEFAULT_TRIM;
      saveStory(currentId, { title: state.title, rows: state.rows, trimSize: state.trimSize });
      upsertIndexEntry(currentId, state.title);
      titleEl.value = state.title;
      trimSelect.value = state.trimSize;
      render();
      closeLibraryPanel();
      titleEl.focus();
    }

    libraryBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (libraryPanel.hidden) openLibraryPanel(); else closeLibraryPanel();
    });
    newStoryboardBtn.addEventListener('click', createNewStoryboard);

    saveLibraryBtn.addEventListener('click', function () {
      save();
      statusEl.textContent = 'Saved to My Storyboards';
      statusEl.classList.add('visible');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { statusEl.classList.remove('visible'); }, 2000);
    });

    var clearBtn = document.getElementById('clear-btn');
    clearBtn.addEventListener('click', function () {
      var ok = window.confirm('Clear this storyboard? This erases the title and all spreads — this can\'t be undone.');
      if (!ok) return;
      state.title = '';
      state.rows = defaultRows();
      save();
      titleEl.value = state.title;
      render();
    });

    document.addEventListener('click', function (e) {
      if (!libraryPanel.hidden && !libraryMenu.contains(e.target)) closeLibraryPanel();
      if (!emailPanel.hidden && !emailMenu.contains(e.target)) closeEmailPanel();
      if (!exportPanel.hidden && !exportMenu.contains(e.target)) closeExportPanel();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!libraryPanel.hidden) closeLibraryPanel();
      if (!emailPanel.hidden) closeEmailPanel();
      if (!exportPanel.hidden) closeExportPanel();
    });

    // ---- Email storyboard ----

    var emailMenu = document.getElementById('email-menu');
    var emailBtn = document.getElementById('email-btn');
    var emailPanel = document.getElementById('email-panel');
    var emailAddr = document.getElementById('email-addr');
    var emailSendBtn = document.getElementById('email-send-btn');
    var emailPanelStatus = document.getElementById('email-panel-status');
    var emailFormatToggle = document.getElementById('email-format-toggle');
    var emailFormat = 'pptx';

    emailFormatToggle.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        emailFormat = btn.dataset.format;
        emailFormatToggle.querySelectorAll('button').forEach(function (b) {
          b.classList.toggle('active', b === btn);
        });
      });
    });

    function bytesToFile(filename, bytes, mime) {
      try { return new File([bytes], filename, { type: mime }); }
      catch (e) { return new Blob([bytes], { type: mime }); }
    }

    try {
      if (window.emailjs && typeof window.emailjs.init === 'function') {
        window.emailjs.init({ publicKey: 'Vb5AmJRuwdKkbSlH4' });
      }
    } catch (e) {}

    function openEmailPanel() {
      emailPanel.hidden = false;
      emailBtn.setAttribute('aria-expanded', 'true');
      emailAddr.focus();
    }

    function closeEmailPanel() {
      emailPanel.hidden = true;
      emailBtn.setAttribute('aria-expanded', 'false');
    }

    function sideText(row, prefix) {
      var part1 = row[prefix] || '';
      var part2 = row[prefix + '2'] || '';
      if (row[prefix + 'Split'] && part2) return part1 ? part1 + ' / ' + part2 : part2;
      return part1;
    }

    function plainStoryboard() {
      var lines = [state.title || 'Untitled Picture Book', ''];
      state.rows.forEach(function (row, i) {
        lines.push('Spread ' + (i + 1));
        lines.push('Verso: ' + sideText(row, 'verso'));
        lines.push('Recto: ' + sideText(row, 'recto'));
        if (row.illustration) lines.push('Illustration notes: ' + row.illustration);
        lines.push('');
      });
      return lines.join('\n');
    }

    emailBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (emailPanel.hidden) openEmailPanel(); else closeEmailPanel();
    });

    emailSendBtn.addEventListener('click', function () {
      if (!emailAddr.checkValidity() || !emailAddr.value.trim()) {
        emailAddr.reportValidity();
        return;
      }
      var email = emailAddr.value.trim();
      var subject = (state.title || 'Untitled Picture Book') + ' — Storyboard';
      var body = plainStoryboard();
      var filename = slugify(state.title) + '.' + emailFormat;

      function fallbackToMailto(note) {
        emailPanelStatus.textContent = note;
        window.location.href = 'mailto:' + encodeURIComponent(email) +
          '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }

      emailSendBtn.disabled = true;
      var originalLabel = emailSendBtn.textContent;
      emailSendBtn.textContent = 'Sending…';
      emailPanelStatus.textContent = '';

      if (window.emailjs && typeof window.emailjs.send === 'function') {
        var attachmentFile = null;
        try {
          if (emailFormat === 'pdf') {
            attachmentFile = bytesToFile(filename, buildPdf(state.title, state.rows, state.trimSize), 'application/pdf');
          } else {
            attachmentFile = bytesToFile(filename, buildPptx(state.title, state.rows, state.trimSize), 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
          }
        } catch (e) {}

        var params = { to_email: email, subject: subject, message: body };
        if (attachmentFile) params.attachment = attachmentFile;

        window.emailjs.send('service_ur7r6mv', 'template_k5wzlc6', params)
          .then(function () {
            emailPanelStatus.textContent = attachmentFile
              ? 'Sent! Check ' + email + ' — the ' + emailFormat.toUpperCase() + ' should be attached (if the email template supports attachments).'
              : 'Sent! Check ' + email + '.';
          }).catch(function () {
            fallbackToMailto('Couldn’t send automatically — opening your mail app instead.');
          }).then(function () {
            emailSendBtn.disabled = false;
            emailSendBtn.textContent = originalLabel;
          });
        return;
      }

      emailSendBtn.disabled = false;
      emailSendBtn.textContent = originalLabel;
      fallbackToMailto('Opening your mail app instead.');
    });

    // ---- Export As… (PowerPoint / PDF) ----

    var exportMenu = document.getElementById('export-menu');
    var exportBtn = document.getElementById('export-btn');
    var exportPanel = document.getElementById('export-panel');
    var exportPptxBtn = document.getElementById('export-pptx-btn');
    var exportPdfBtn = document.getElementById('export-pdf-btn');
    var exportStatus = document.getElementById('export-status');
    var exportStatusTimer = null;

    function setExportStatus(msg, persist) {
      exportStatus.textContent = msg;
      clearTimeout(exportStatusTimer);
      if (!persist) {
        exportStatusTimer = setTimeout(function () { exportStatus.textContent = ''; }, 6000);
      }
    }

    function openExportPanel() {
      exportPanel.hidden = false;
      exportBtn.setAttribute('aria-expanded', 'true');
    }

    function closeExportPanel() {
      exportPanel.hidden = true;
      exportBtn.setAttribute('aria-expanded', 'false');
    }

    exportBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (exportPanel.hidden) openExportPanel(); else closeExportPanel();
    });

    function escapeXml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function textToParagraphs(text, sz, algn) {
      var lines = String(text || '').split(/\r\n|\r|\n/);
      var pPr = algn ? '<a:pPr algn="' + algn + '"/>' : '';
      return lines.map(function (line) {
        if (!line) return '<a:p>' + pPr + '</a:p>';
        return '<a:p>' + pPr + '<a:r><a:rPr lang="en-US" sz="' + sz + '" dirty="0"><a:latin typeface="Poppins"/></a:rPr><a:t>' + escapeXml(line) + '</a:t></a:r></a:p>';
      }).join('');
    }

    function slugify(s) {
      var out = String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return out || 'book-dummy';
    }

    // ---- minimal ZIP (stored, uncompressed) writer ----

    var crc32Table = null;
    function crc32(bytes) {
      if (!crc32Table) {
        crc32Table = new Uint32Array(256);
        for (var n = 0; n < 256; n++) {
          var c = n;
          for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          crc32Table[n] = c >>> 0;
        }
      }
      var crc = 0xFFFFFFFF;
      for (var i = 0; i < bytes.length; i++) {

        dv.setUint16(4, 20, true);
        dv.setUint16(6, 0, true);
        dv.setUint16(8, 0, true);
        dv.setUint16(10, 0, true);
        dv.setUint16(12, 0x21, true);
        dv.setUint32(14, crc, true);
        dv.setUint32(18, size, true);
        dv.setUint32(22, size, true);
        dv.setUint16(26, nameBytes.length, true);
        dv.setUint16(28, 0, true);
        local.set(nameBytes, 30);
        localParts.push(local, data);

        var central = new Uint8Array(46 + nameBytes.length);
        var dvc = new DataView(central.buffer);
        dvc.setUint32(0, 0x02014b50, true);
        dvc.setUint16(4, 20, true);
        dvc.setUint16(6, 20, true);
        dvc.setUint16(8, 0, true);
        dvc.setUint16(10, 0, true);
        dvc.setUint16(12, 0, true);
        dvc.setUint16(14, 0x21, true);
        dvc.setUint32(16, crc, true);
        dvc.setUint32(20, size, true);
        dvc.setUint32(24, size, true);
        dvc.setUint16(28, nameBytes.length, true);
        dvc.setUint16(30, 0, true);
        dvc.setUint16(32, 0, true);
        dvc.setUint16(34, 0, true);
        dvc.setUint16(36, 0, true);
        dvc.setUint32(38, 0, true);
        dvc.setUint32(42, offset, true);

        centralParts.push(central);

      dve.setUint32(0, 0x06054b50, true);
      dve.setUint16(4, 0, true);
      dve.setUint16(6, 0, true);

      dve.setUint16(10, files.length, true);

      dve.setUint32(16, centralStart, true);

    function slideXml(row, SLIDE_W, SLIDE_H) {
      var MARGIN = 457200, GUTTER_HALF_GAP = 114300, BOTTOM_MARGIN = 228600;
      var half = SLIDE_W / 2;
      var SIDE_W = half - MARGIN - GUTTER_HALF_GAP;
      var VERSO_X = MARGIN, RECTO_X = half + GUTTER_HALF_GAP;
      var BOX_W = Math.round(SIDE_W * 0.8);
      var BOTTOM_Y = Math.round(SLIDE_H * 0.75);
      var BOX_H = Math.round(SLIDE_H * 0.25 - BOTTOM_MARGIN);
      var HALF_Y = Math.round((SLIDE_H - BOX_H) / 2);
      var versoX = Math.round(VERSO_X + (SIDE_W - BOX_W) / 2);
      var rectoX = Math.round(RECTO_X + (SIDE_W - BOX_W) / 2);

      var shapes = '';
      var shapeId = 2;

      shapes += makeGutterLine(shapeId++, SLIDE_W, SLIDE_H);

      function addSide(x, prefix, label) {
        if (row[prefix + 'Split']) {
          shapes += makeTextBoxSp(shapeId++, label + ' 1', x, HALF_Y, BOX_W, BOX_H, row[prefix]);
          shapes += makeTextBoxSp(shapeId++, label + ' 2', x, BOTTOM_Y, BOX_W, BOX_H, row[prefix + '2']);
        } else {
          shapes += makeTextBoxSp(shapeId++, label, x, BOTTOM_Y, BOX_W, BOX_H, row[prefix]);

      addSide(rectoX, 'recto', 'Recto');

      83: 667, 84: 611, 85: 722, 86: 667, 87: 944, 88: 667, 89: 667, 90: 611,
      91: 278, 92: 278, 93: 278, 94: 469, 95: 556, 96: 333,
      97: 556, 98: 556, 99: 500, 100: 556, 101: 556, 102: 278, 103: 556, 104: 556,
      105: 222, 106: 222, 107: 500, 108: 222, 109: 833, 110: 556, 111: 556, 112: 556,
      113: 556, 114: 333, 115: 500, 116: 278, 117: 556, 118: 500, 119: 722, 120: 500,
      121: 500, 122: 500, 123: 334, 124: 260, 125: 334, 126: 584
    };

    var WINANSI_MAP = {
      0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94,
      0x2013: 0x96, 0x2014: 0x97, 0x2026: 0x85, 0x2022: 0x95
    };

    function toWinAnsiBytes(str) {
      var bytes = [];
      for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        var b;
        if (code < 0x80) b = code;
        else if (WINANSI_MAP[code] !== undefined) b = WINANSI_MAP[code];
        else if (code >= 0xA0 && code <= 0xFF) b = code;
        else b = 0x3F;
        bytes.push(b);
      }
      return bytes;
    }

    function pdfLiteralStringBytes(str) {
      var out = [0x28];
      toWinAnsiBytes(str).forEach(function (b) {
        if (b === 0x28 || b === 0x29 || b === 0x5C) out.push(0x5C, b);
        else out.push(b);
      });
      out.push(0x29);
      return out;
    }

    // Document /Info strings use PDFDocEncoding by default, not the WinAnsi
    // mapping content-stream text uses via the fonts' /Encoding -- so keep
    // metadata strictly ASCII to avoid the two encodings disagreeing.
    function toAsciiSafe(str) {
      return String(str || '')
        .replace(/[‘’]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[–—]/g, '-')
        .replace(/…/g, '...')
        .replace(/[^\x20-\x7E]/g, '?');
    }

    function textWidth(str, fontSize) {
      var total = 0;
      for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        total += (HELVETICA_WIDTHS[code] !== undefined ? HELVETICA_WIDTHS[code] : 556);
      }
      return total / 1000 * fontSize;
    }

    function wrapText(text, maxWidth, fontSize, maxLines) {
      var paragraphs = String(text || '').split(/\r\n|\r|\n/);
      var lines = [];
      paragraphs.forEach(function (para) {
        if (!para) { lines.push(''); return; }
        var words = para.split(' ');
        var current = '';
        words.forEach(function (word) {
          var test = current ? current + ' ' + word : word;
          if (!current || textWidth(test, fontSize) <= maxWidth) {
            current = test;
          } else {
            lines.push(current);
            current = word;
          }
        });
        lines.push(current);
      });
      if (maxLines && lines.length > maxLines) {
        lines = lines.slice(0, maxLines);
        var last = lines[maxLines - 1];
        while (last.length > 0 && textWidth(last + '…', fontSize) > maxWidth) {
          last = last.slice(0, -1);
        }
        lines[maxLines - 1] = last + '…';
      }
      return lines;
    }

    function pushAsciiPdf(arr, str) {
      for (var i = 0; i < str.length; i++) arr.push(str.charCodeAt(i) & 0xFF);
    }

    function pushBytesPdf(arr, bytes) {
      for (var i = 0; i < bytes.length; i++) arr.push(bytes[i]);
    }

    function pdfDrawText(c, x, yBottom, str, fontKey, fontSize, rgb) {
      if (!str) return;
      pushAsciiPdf(c, 'BT\n/' + fontKey + ' ' + fontSize + ' Tf\n' +
        rgb[0] + ' ' + rgb[1] + ' ' + rgb[2] + ' rg\n' +
        x.toFixed(2) + ' ' + yBottom.toFixed(2) + ' Td\n');
      pushBytesPdf(c, pdfLiteralStringBytes(str));
      pushAsciiPdf(c, ' Tj\nET\n');
    }

    function pdfDrawLines(c, x, startYBottom, lines, fontKey, fontSize, lineHeight, rgb) {
      lines.forEach(function (line, i) {
        pdfDrawText(c, x, startYBottom - i * lineHeight, line, fontKey, fontSize, rgb);
      });
    }

    function pdfDashedRect(c, x, yBottom, w, h, gray) {
      pushAsciiPdf(c, gray + ' G\n[6 3] 0 d\n3 w\n' +
        x.toFixed(2) + ' ' + yBottom.toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re\nS\n');
    }

    function pdfDashedLine(c, x1, y1, x2, y2, gray) {
      pushAsciiPdf(c, gray + ' G\n[6 3] 0 d\n3 w\n' +
        x1.toFixed(2) + ' ' + y1.toFixed(2) + ' m\n' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' l\nS\n');
    }

    var PDF_INK = [0.086, 0.196, 0.251];
    var PDF_MUTED = [0.31, 0.45, 0.5];
    var PDF_BORDER_GRAY = '0.6';

    function buildPdfPageContent(spreadIndex, row, pageW, pageH, title) {
      var MARGIN = 36, GUTTER_HALF_GAP = 9, BOTTOM_MARGIN = 18, PAD = 8;
      var half = pageW / 2;
      var sideW = half - MARGIN - GUTTER_HALF_GAP;
      var versoX = MARGIN, rectoX = half + GUTTER_HALF_GAP;
      var boxW = sideW * 0.8;
      var boxH = pageH * 0.25 - BOTTOM_MARGIN;
      var bottomTopY = pageH * 0.75;
      var halfTopY = (pageH - boxH) / 2;
      var versoBoxX = versoX + (sideW - boxW) / 2;
      var rectoBoxX = rectoX + (sideW - boxW) / 2;

      function topToBottom(topDist, h) { return pageH - topDist - h; }

      var c = [];

      pdfDrawText(c, MARGIN, pageH - 28,
        'Spread ' + (spreadIndex + 1) + (title ? ' — ' + title : ''), 'F1B', 10, PDF_MUTED);

      if (row.illustration) {
        var notesWidth = pageW - MARGIN * 2;
        pdfDrawText(c, MARGIN, pageH - 46, 'Illustration notes', 'F1B', 8, PDF_MUTED);
        var noteLines = wrapText(row.illustration, notesWidth, 9, 4);
        pdfDrawLines(c, MARGIN, pageH - 58, noteLines, 'F2', 9, 12, PDF_MUTED);
      }

      pdfDashedLine(c, half, 0, half, pageH, PDF_BORDER_GRAY);

      function drawBox(x, topDist, text) {
        var yBottom = topToBottom(topDist, boxH);
        pdfDashedRect(c, x, yBottom, boxW, boxH, PDF_BORDER_GRAY);
        var lines = wrapText(text, boxW - PAD * 2, 11, Math.max(1, Math.floor((boxH - PAD * 2) / 14)));
        var textBlockH = lines.length * 14;
        var firstBaseline = yBottom + (boxH + textBlockH) / 2 - 11;
        pdfDrawLines(c, x + PAD, firstBaseline, lines, 'F1', 11, 14, PDF_INK);
      }

      function drawSide(x, prefix) {
        if (row[prefix + 'Split']) {
          drawBox(x, halfTopY, row[prefix]);
          drawBox(x, bottomTopY, row[prefix + '2']);
        } else {
          drawBox(x, bottomTopY, row[prefix]);
        }
      }

      drawSide(versoBoxX, 'verso');
      drawSide(rectoBoxX, 'recto');

      return c;
    }

    function pad10(n) {
      var s = String(n);
      while (s.length < 10) s = '0' + s;
      return s;
    }

    function buildPdf(title, rows, trimKey) {
      var trim = getTrimSize(trimKey);
      var pageW = Math.round(trim.pageW * 2 * 72);
      var pageH = Math.round(trim.pageH * 72);
      var n = rows.length;

      var parts = [];
      var offsets = [];
      var pos = 0;

      function pushPart(chunk) {
        var u8 = typeof chunk === 'string' ? new TextEncoder().encode(chunk) : new Uint8Array(chunk);
        parts.push(u8);
        pos += u8.length;
      }
      function beginObj(num) { offsets[num] = pos; pushPart(num + ' 0 obj\n'); }
      function endObj() { pushPart('endobj\n'); }

      var pageObjStart = 3;
      var contentObjStart = pageObjStart + n;
      var fontRegularNum = contentObjStart + n;
      var fontBoldNum = fontRegularNum + 1;
      var fontObliqueNum = fontBoldNum + 1;
      var infoNum = fontObliqueNum + 1;

      pushPart('%PDF-1.4\n');

      beginObj(1);
      pushPart('<< /Type /Catalog /Pages 2 0 R >>\n');
      endObj();

      var kids = [];
      for (var i = 0; i < n; i++) kids.push((pageObjStart + i) + ' 0 R');
      beginObj(2);
      pushPart('<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\n');
      endObj();

      for (var p = 0; p < n; p++) {
        var contentBytes = buildPdfPageContent(p, rows[p], pageW, pageH, title);
        var contentU8 = new Uint8Array(contentBytes);

        beginObj(pageObjStart + p);
        pushPart('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + ']' +
          ' /Resources << /Font << /F1 ' + fontRegularNum + ' 0 R /F1B ' + fontBoldNum + ' 0 R /F2 ' + fontObliqueNum + ' 0 R >> >>' +
          ' /Contents ' + (contentObjStart + p) + ' 0 R >>\n');
        endObj();

        beginObj(contentObjStart + p);
        pushPart('<< /Length ' + contentU8.length + ' >>\nstream\n');
        pushPart(contentU8);
        pushPart('\nendstream\n');
        endObj();
      }

      beginObj(fontRegularNum);
      pushPart('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n');
      endObj();

      beginObj(fontBoldNum);
      pushPart('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\n');
      endObj();

      beginObj(fontObliqueNum);
      pushPart('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>\n');
      endObj();

      beginObj(infoNum);
      pushPart('<< /Title ');
      pushPart(pdfLiteralStringBytes(toAsciiSafe(title || 'Untitled Picture Book')));
      pushPart(' /Producer (Book Dummy) >>\n');
      endObj();

      var xrefOffset = pos;
      var totalObjs = infoNum + 1;
      var xrefLines = ['0000000000 65535 f \n'];
      for (var num = 1; num <= infoNum; num++) {
        xrefLines.push(pad10(offsets[num]) + ' 00000 n \n');
      }
      pushPart('xref\n0 ' + totalObjs + '\n' + xrefLines.join(''));
      pushPart('trailer\n<< /Size ' + totalObjs + ' /Root 1 0 R /Info ' + infoNum + ' 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF');

      var total = 0;
      parts.forEach(function (part) { total += part.length; });
      var result = new Uint8Array(total);
      var o = 0;
      parts.forEach(function (part) { result.set(part, o); o += part.length; });
      return result;
    }

    // ---- Export As… wiring ----

    function downloadBlob(filename, bytes, mime) {
      var blob = new Blob([bytes], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    function exportFile(kind) {
      closeExportPanel();
      exportBtn.disabled = true;
      setExportStatus('Preparing file…', true);

      try {
        var bytes, filename, mime;
        if (kind === 'pdf') {
          bytes = buildPdf(state.title, state.rows, state.trimSize);
          filename = slugify(state.title) + '.pdf';
          mime = 'application/pdf';
        } else {
          bytes = buildPptx(state.title, state.rows, state.trimSize);
          filename = slugify(state.title) + '.pptx';
          mime = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
        }

        var successNote = kind === 'pdf' ? '.' : ' — in Google Slides, use File → Import slides, or open it from Drive.';
        var useClaudeDownloads = typeof window.claude !== 'undefined' && typeof window.claude.use === 'function';

        if (useClaudeDownloads) {
          window.claude.use('downloads').then(function (downloads) {
            if (downloads) {
              return downloads.save({ filename: filename, data: bytes }).then(function () {
                setExportStatus('Saved ' + filename + successNote, true);
              });
            }
            downloadBlob(filename, bytes, mime);
            setExportStatus('Downloaded ' + filename + successNote, true);
          }).catch(function () {
            downloadBlob(filename, bytes, mime);
            setExportStatus('Downloaded ' + filename + successNote, true);
          }).then(function () {
            exportBtn.disabled = false;
          });
        } else {
          downloadBlob(filename, bytes, mime);
          setExportStatus('Downloaded ' + filename + successNote, true);
          exportBtn.disabled = false;
        }
      } catch (err) {
        setExportStatus('Couldn’t export: ' + (err && err.message ? err.message : 'unknown error'));
        exportBtn.disabled = false;
      }
    }

    exportPptxBtn.addEventListener('click', function () { exportFile('pptx'); });
    exportPdfBtn.addEventListener('click', function () { exportFile('pdf'); });
  })();
</script>

</body>
</html>
