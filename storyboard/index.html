<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyboard — Jake Goldwasser</title>
<meta name="description" content="A 14-spread grid for drafting picture book text and illustration notes.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root {
    --paper: #F5FAFB;
    --surface: #FFFFFF;
    --surface-2: #E7F5F3;
    --ink: #163240;
    --ink-soft: #4F7480;
    --ink-faint: #93AFB6;
    --line: #D7E8EA;
    --line-strong: #A9CCD0;
    --accent: #1E4FDB;
    --accent-ink: #FFFFFF;
    --accent-soft: #DEE6FC;
    --teal: #00A99A;
    --danger: #BD5138;
    --danger-soft: #FAEAE4;
    --shadow: rgba(20, 45, 56, 0.08);
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
    padding: 40px clamp(16px, 4vw, 56px) 80px;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---- Header ---- */

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 360px;
    min-width: 0;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  #title-input {
    font-family: "EB Garamond", ui-serif, Georgia, serif;
    font-weight: 500;
    font-size: clamp(30px, 4vw, 44px);
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line-strong);
    padding: 2px 2px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #title-input::placeholder { color: var(--ink-faint); }
  #title-input:focus { border-bottom-color: var(--accent); }

  .meta-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .spread-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .spread-count strong {
    color: var(--ink);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .save-status {
    font-size: 11px;
    color: var(--ink-faint);
    height: 14px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .save-status.visible { opacity: 1; }

  /* ---- Sheet ---- */

  .sheet-scroll {
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .sheet {
    display: grid;
    grid-template-columns: 64px minmax(340px, 2fr) minmax(220px, 1fr);
    gap: 10px;
    min-width: 680px;
  }

  .col-head {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 0 4px 6px;
    align-self: end;
  }

  .col-head.head-num { text-align: center; }

  .col-head-pair {
    display: flex;
    padding: 0;
  }

  .col-head-pair span {
    flex: 1 1 50%;
    padding: 0 4px 6px 14px;
  }

  /* spread number */

  .num-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
    cursor: grab;
    user-select: none;
    border-radius: var(--radius);
    transition: background-color 0.12s ease;
  }

  .num-cell:hover { background: var(--surface-2); }
  .num-cell.dragging { opacity: 0.35; }
  .num-cell:active { cursor: grabbing; }

  .num-cell .n { font-size: 28px; }

  .num-cell .remove-row {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--danger);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .num-cell:hover .remove-row { display: flex; }
  .num-cell .remove-row:hover { background: var(--danger-soft); }

  /* insert-spread gaps between rows */

  .row-gap {
    grid-column: 1 / -1;
    position: relative;
    height: 8px;
    cursor: pointer;
    z-index: 1;
  }

  .row-gap::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.12s ease, background-color 0.12s ease;
  }

  .row-gap .insert-pill {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 999px;
    padding: 3px 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }

  .row-gap:hover::before,
  .row-gap.drag-target::before { opacity: 1; }

  .row-gap:hover .insert-pill,
  .row-gap.drag-target .insert-pill { opacity: 1; }

  .row-gap.drag-target::before {
    background: var(--teal);
    height: 3px;
  }

  .row-gap.drag-target .insert-pill { background: var(--teal); }

  textarea.cell {
    font-family: "EB Garamond", ui-serif, Georgia, serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 12px 14px;
    resize: none;
    overflow: hidden;
    min-height: 64px;
    width: 100%;
    box-shadow: 0 1px 2px var(--shadow);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea.cell::placeholder { color: var(--ink-faint); }

  textarea.cell:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  textarea.illustration {
    background: var(--surface-2);
    color: var(--ink-soft);
  }

  textarea.illustration:focus { color: var(--ink); }

  /* verso + recto: one connected unit, split only by a dotted rule */

  .spread-pair {
    display: flex;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px var(--shadow);
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .spread-pair:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .pair-side {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .spread-pair textarea.cell {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .spread-pair textarea.cell:focus {
    box-shadow: none;
  }

  .pair-divider {
    align-self: stretch;
    width: 3px;
    flex: none;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--line-strong) 0,
      var(--line-strong) 10px,
      transparent 10px,
      transparent 17px
    );
  }

  .pair-divider-h {
    flex: none;
    height: 3px;
    background-image: repeating-linear-gradient(
      to right,
      var(--line-strong) 0,
      var(--line-strong) 10px,
      transparent 10px,
      transparent 17px
    );
  }

  .split-toggle {
    position: absolute;
    top: 4px;
    right: 4px;
    font-family: "Poppins", sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 2px 9px;
    cursor: pointer;
    opacity: 0;
    z-index: 2;
    transition: opacity 0.12s ease, background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .pair-side:hover .split-toggle,
  .split-toggle:focus-visible { opacity: 1; }

  .split-toggle:hover {
    background: var(--surface-2);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ---- Footer / add row ---- */

  .sheet-footer {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }

  .add-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 11px 20px 11px 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .add-row:hover { box-shadow: 0 4px 10px var(--shadow); transform: translateY(-1px); }
  .add-row:active { transform: translateY(0); }
  .add-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .add-row .plus {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    font-size: 13px;
    line-height: 1;
  }

  .export-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease, color 0.12s ease;
  }

  .export-btn:hover { background: var(--surface-2); }
  .export-btn:disabled { opacity: 0.6; cursor: default; }
  .export-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  .export-status {
    font-size: 12px;
    color: var(--ink-soft);
    max-width: 320px;
  }

  .trim-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .trim-select {
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .trim-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- My Storyboards menu ---- */

  .library-menu {
    position: relative;
  }

  .library-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }

  .library-btn:hover,
  .library-btn[aria-expanded="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }

  .library-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .library-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 270px;
    max-width: 80vw;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px var(--shadow);
    padding: 10px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .library-panel[hidden] { display: none; }

  .new-storyboard-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .new-storyboard-btn:hover { opacity: 0.9; }
  .new-storyboard-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .library-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 260px;
    overflow-y: auto;
  }

  .library-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    color: var(--ink);
  }

  .library-entry:hover { background: var(--surface-2); }

  .library-entry.current {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    cursor: default;
  }

  .library-entry-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .library-entry-delete {
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--danger);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .library-entry:hover .library-entry-delete { display: flex; }
  .library-entry-delete:hover { background: var(--danger-soft); }

  .library-empty {
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    padding: 12px 4px;
  }

  .save-library-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .save-library-btn:hover { background: var(--accent-soft); }
  .save-library-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- Email storyboard ---- */

  .email-menu {
    position: relative;
  }

  .email-btn {
    display: inline-flex;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .email-btn:hover,
  .email-btn[aria-expanded="true"] { background: var(--surface-2); }
  .email-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  .email-panel {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    width: 260px;
    max-width: 80vw;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px var(--shadow);
    padding: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .email-panel[hidden] { display: none; }

  .email-panel-label {
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .email-panel input[type="email"] {
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 10px;
    width: 100%;
  }

  .email-panel input[type="email"]:focus {
    outline: none;
    border-color: var(--teal);
  }

  .email-send-btn {
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--teal);
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .email-send-btn:hover { opacity: 0.9; }
  .email-send-btn:disabled { opacity: 0.6; cursor: default; }

  .email-panel-status {
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <div class="title-block">
      <span class="eyebrow">Picture Book Manuscript</span>
      <input id="title-input" type="text" placeholder="Untitled Picture Book" autocomplete="off" />
    </div>
    <div class="meta-panel">
      <div class="library-menu" id="library-menu">
        <button class="library-btn" id="library-btn" type="button" aria-expanded="false">My Storyboards ▾</button>
        <div class="library-panel" id="library-panel" hidden>
          <button class="new-storyboard-btn" id="new-storyboard-btn" type="button">+ New Storyboard</button>
          <div class="library-list" id="library-list"></div>
        </div>
      </div>
      <span class="spread-count"><strong id="spread-total">14</strong> spreads</span>
      <span class="save-status" id="save-status">Saved</span>
    </div>
  </header>

  <div class="sheet-scroll">
    <div class="sheet" id="sheet">
      <span class="col-head head-num">Spread</span>
      <div class="col-head col-head-pair">
        <span>Verso Text</span>
        <span>Recto Text</span>
      </div>
      <span class="col-head">Illustration</span>
      <!-- rows injected here -->
    </div>
  </div>

  <div class="sheet-footer">
    <button class="add-row" id="add-row-btn" type="button">
      <span class="plus">+</span>
      Add Spread
    </button>
    <label class="trim-label" for="trim-select">
      Book size
      <select id="trim-select" class="trim-select"></select>
    </label>
    <button class="export-btn" id="export-btn" type="button">
      Export to Slides
    </button>
    <div class="email-menu" id="email-menu">
      <button class="email-btn" id="email-btn" type="button" aria-expanded="false">Email Storyboard</button>
      <div class="email-panel" id="email-panel" hidden>
        <label class="email-panel-label" for="email-addr">Send to</label>
        <input type="email" id="email-addr" placeholder="you@example.com" required />
        <button class="email-send-btn" id="email-send-btn" type="button">Send</button>
        <p class="email-panel-status" id="email-panel-status"></p>
      </div>
    </div>
    <button class="save-library-btn" id="save-library-btn" type="button">
      Save to My Storyboards
    </button>
    <span class="export-status" id="export-status"></span>
  </div>
</div>

<script>
  (function () {
    var STORAGE_KEY = 'book-dummy-script-v1';
    var INDEX_KEY = 'book-dummy-index-v1';
    var STORY_PREFIX = 'book-dummy-story-';
    var CURRENT_KEY = 'book-dummy-current-v1';
    var INITIAL_ROWS = 14;
    var currentId = null;
    var sheetEl = document.getElementById('sheet');
    var titleEl = document.getElementById('title-input');
    var addBtn = document.getElementById('add-row-btn');
    var totalEl = document.getElementById('spread-total');
    var statusEl = document.getElementById('save-status');
    var draggedIndex = null;

    var TRIM_SIZES = [
      { key: '8.5x8.5', label: '8.5" × 8.5" (Square)', pageW: 8.5, pageH: 8.5 },
      { key: '8x8', label: '8" × 8" (Square)', pageW: 8, pageH: 8 },
      { key: '8.5x11', label: '8.5" × 11" (Portrait)', pageW: 8.5, pageH: 11 },
      { key: '8x10', label: '8" × 10" (Portrait)', pageW: 8, pageH: 10 },
      { key: '10x8', label: '10" × 8" (Landscape)', pageW: 10, pageH: 8 },
      { key: '11x8.5', label: '11" × 8.5" (Landscape)', pageW: 11, pageH: 8.5 }
    ];
    var DEFAULT_TRIM = '8.5x8.5';

    function getTrimSize(key) {
      for (var i = 0; i < TRIM_SIZES.length; i++) {
        if (TRIM_SIZES[i].key === key) return TRIM_SIZES[i];
      }
      return TRIM_SIZES[0];
    }

    var state = { title: '', rows: [], trimSize: DEFAULT_TRIM };

    function blankRow() {
      return { verso: '', verso2: '', versoSplit: false, recto: '', recto2: '', rectoSplit: false, illustration: '' };
    }

    function normalizeRow(row) {
      row = row || {};
      return {
        verso: row.verso || '',
        verso2: row.verso2 || '',
        versoSplit: !!row.versoSplit,
        recto: row.recto || '',
        recto2: row.recto2 || '',

    function defaultRows() {

    function makeId() {

    function loadIndex() {

    function saveIndex(list) {

    function upsertIndexEntry(id, title) {

      var found = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) { found = list[i]; break; }
      }
      var displayTitle = title && title.trim() ? title.trim() : 'Untitled Picture Book';
      if (found) {
        found.title = displayTitle;
        found.updatedAt = Date.now();
      } else {
        list.push({ id: id, title: displayTitle, updatedAt: Date.now() });
      }
      saveIndex(list);
    }

    function removeIndexEntry(id) {
      var list = loadIndex().filter(function (e) { return e.id !== id; });
      saveIndex(list);
      try { localStorage.removeItem(STORY_PREFIX + id); } catch (e) {}
    }

    function loadStory(id) {
      try {
        var raw = localStorage.getItem(STORY_PREFIX + id);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        return {
          title: parsed.title || '',
          rows: Array.isArray(parsed.rows) && parsed.rows.length ? parsed.rows.map(normalizeRow) : defaultRows(),
          trimSize: getTrimSize(parsed.trimSize).key

      } catch (e) { return null; }
    }

    function saveStory(id, data) {
      try { localStorage.setItem(STORY_PREFIX + id, JSON.stringify(data)); } catch (e) {}

    function initLibrary() {
      var savedCurrent = null;
      try { savedCurrent = localStorage.getItem(CURRENT_KEY); } catch (e) {}

      if (savedCurrent) {
        var existing = loadStory(savedCurrent);
        if (existing) {
          currentId = savedCurrent;
          state.title = existing.title;
          state.rows = existing.rows;
          state.trimSize = existing.trimSize;
          return;
        }
      }

      // First run, or the pointed-to story vanished: migrate the old
      // single-storyboard data if present, otherwise start fresh.
      var legacy = null;
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) legacy = JSON.parse(raw);
      } catch (e) {}

      currentId = makeId();
      if (legacy && Array.isArray(legacy.rows) && legacy.rows.length) {
        state.title = legacy.title || '';
        state.rows = legacy.rows.map(normalizeRow);
        state.trimSize = getTrimSize(legacy.trimSize).key;
      } else {
        state.title = '';
        state.rows = defaultRows();
        state.trimSize = DEFAULT_TRIM;

      saveStory(currentId, { title: state.title, rows: state.rows, trimSize: state.trimSize });

        dvc.setUint16(6, 20, true);
        dvc.setUint16(8, 0, true);
        dvc.setUint16(10, 0, true);
        dvc.setUint16(12, 0, true);
        dvc.setUint16(14, 0x21, true);
        dvc.setUint32(16, crc, true);
        dvc.setUint32(20, size, true);
        dvc.setUint32(24, size, true);
        dvc.setUint16(28, nameBytes.length, true);
        dvc.setUint16(30, 0, true);
        dvc.setUint16(32, 0, true);

        dvc.setUint16(36, 0, true);
        dvc.setUint32(38, 0, true);

      dve.setUint32(16, centralStart, true);
      dve.setUint16(20, 0, true);

      '<a:ln w="19050"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln>' +
      '</a:lnStyleLst>' +
      '<a:effectStyleLst>' +
      '<a:effectStyle><a:effectLst/></a:effectStyle>' +
      '<a:effectStyle><a:effectLst/></a:effectStyle>' +
      '<a:effectStyle><a:effectLst/></a:effectStyle>' +
      '</a:effectStyleLst>' +
      '<a:bgFillStyleLst>' +
      '<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>' +
      '<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>' +
      '<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>' +
      '</a:bgFillStyleLst>' +
      '</a:fmtScheme>' +
      '</a:themeElements>' +
      '</a:theme>';

    function makeTextBoxSp(id, name, x, y, w, h, text) {
      return '<p:sp><p:nvSpPr><p:cNvPr id="' + id + '" name="' + name + '"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>' +
        '<p:spPr><a:xfrm><a:off x="' + x + '" y="' + y + '"/><a:ext cx="' + w + '" cy="' + h + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>' +
        '<a:ln w="38100"><a:solidFill><a:srgbClr val="999999"/></a:solidFill><a:prstDash val="dash"/></a:ln></p:spPr>' +
        '<p:txBody><a:bodyPr wrap="square" anchor="ctr"><a:normAutofit/></a:bodyPr><a:lstStyle/>' + textToParagraphs(text, 1800, 'l') + '</p:txBody></p:sp>';
    }

    function makeGutterLine(id, slideW, slideH) {
      var gutterX = Math.round(slideW / 2);
      return '<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="' + id + '" name="Gutter"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr>' +
        '<p:spPr><a:xfrm><a:off x="' + gutterX + '" y="0"/><a:ext cx="0" cy="' + slideH + '"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom>' +
        '<a:ln w="38100"><a:solidFill><a:srgbClr val="999999"/></a:solidFill><a:prstDash val="dash"/></a:ln></p:spPr>' +
        '</p:cxnSp>';
    }

    function slideXml(row, SLIDE_W, SLIDE_H) {
      var MARGIN = 457200, GUTTER_HALF_GAP = 114300, BOTTOM_MARGIN = 228600;
      var half = SLIDE_W / 2;
      var SIDE_W = half - MARGIN - GUTTER_HALF_GAP;
      var VERSO_X = MARGIN, RECTO_X = half + GUTTER_HALF_GAP;
      var BOX_W = Math.round(SIDE_W * 0.8);
      var BOTTOM_Y = Math.round(SLIDE_H * 0.75);
      var BOX_H = Math.round(SLIDE_H * 0.25 - BOTTOM_MARGIN);
      var HALF_Y = Math.round((SLIDE_H - BOX_H) / 2);
      var versoX = Math.round(VERSO_X + (SIDE_W - BOX_W) / 2);
      var rectoX = Math.round(RECTO_X + (SIDE_W - BOX_W) / 2);

      var shapes = '';
      var shapeId = 2;

      shapes += makeGutterLine(shapeId++, SLIDE_W, SLIDE_H);

      function addSide(x, prefix, label) {
        if (row[prefix + 'Split']) {
          shapes += makeTextBoxSp(shapeId++, label + ' 1', x, HALF_Y, BOX_W, BOX_H, row[prefix]);
          shapes += makeTextBoxSp(shapeId++, label + ' 2', x, BOTTOM_Y, BOX_W, BOX_H, row[prefix + '2']);
        } else {
          shapes += makeTextBoxSp(shapeId++, label, x, BOTTOM_Y, BOX_W, BOX_H, row[prefix]);
        }
      }

      addSide(versoX, 'verso', 'Verso');
      addSide(rectoX, 'recto', 'Recto');

      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
        '<p:cSld><p:spTree>' +
        '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>' +
        shapes +
        '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>';
    }

    function notesSlideXml(notesText) {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<p:notes xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
        '<p:cSld><p:spTree>' +
        '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>' +
        '<p:sp><p:nvSpPr><p:cNvPr id="2" name="Notes Placeholder"/><p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr><p:nvPr><p:ph type="body" idx="1"/></p:nvPr></p:nvSpPr>' +
        '<p:spPr/>' +
        '<p:txBody><a:bodyPr/><a:lstStyle/>' + textToParagraphs(notesText, 1200) + '</p:txBody></p:sp>' +
        '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:notes>';
    }

    function buildPptx(title, rows, trimKey) {
      var trim = getTrimSize(trimKey);
      var SLIDE_W = Math.round(trim.pageW * 2 * 914400);
      var SLIDE_H = Math.round(trim.pageH * 914400);
      var n = rows.length;
      var files = [];
      function addXml(name, xmlStr) { files.push({ name: name, data: strToBytes(xmlStr) }); }

      var overrides =
        '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>' +
        '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>' +
        '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>' +
        '<Override PartName="/ppt/notesMasters/notesMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.notesMaster+xml"/>' +
        '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>';
      for (var i = 1; i <= n; i++) {
        overrides += '<Override PartName="/ppt/slides/slide' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>';
        overrides += '<Override PartName="/ppt/notesSlides/notesSlide' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.notesSlide+xml"/>';
      }
      overrides +=
        '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
        '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>';

      addXml('[Content_Types].xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' + overrides + '</Types>');

      addXml('_rels/.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
        '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
        '</Relationships>');

      var sldIdEntries = '';
      var relEntries = '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>';
      for (var i2 = 1; i2 <= n; i2++) {
        var rid = 'rId' + (i2 + 1);
        sldIdEntries += '<p:sldId id="' + (255 + i2) + '" r:id="' + rid + '"/>';
        relEntries += '<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide' + i2 + '.xml"/>';
      }
      var notesMasterRid = 'rId' + (n + 2);
      relEntries += '<Relationship Id="' + notesMasterRid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesMaster" Target="notesMasters/notesMaster1.xml"/>';

      addXml('ppt/presentation.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
        '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>' +
        '<p:notesMasterIdLst><p:notesMasterId r:id="' + notesMasterRid + '"/></p:notesMasterIdLst>' +
        '<p:sldIdLst>' + sldIdEntries + '</p:sldIdLst>' +
        '<p:sldSz cx="' + SLIDE_W + '" cy="' + SLIDE_H + '"/>' +
        '<p:notesSz cx="6858000" cy="9144000"/>' +
        '</p:presentation>');

      addXml('ppt/_rels/presentation.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + relEntries + '</Relationships>');

      addXml('ppt/theme/theme1.xml', THEME_XML);

      addXml('ppt/slideMasters/slideMaster1.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
        '<p:cSld><p:bg><p:bgRef idx="1001"><a:schemeClr val="bg1"/></p:bgRef></p:bg><p:spTree>' +
        '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>' +
        '</p:spTree></p:cSld>' +
        '<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>' +
        '<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>' +
        '</p:sldMaster>');

      addXml('ppt/slideMasters/_rels/slideMaster1.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/>' +
        '</Relationships>');

      addXml('ppt/slideLayouts/slideLayout1.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" type="blank" preserve="1">' +
        '<p:cSld name="Blank"><p:spTree>' +
        '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>' +
        '</p:spTree></p:cSld>' +
        '<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr>' +
        '</p:sldLayout>');

      addXml('ppt/slideLayouts/_rels/slideLayout1.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/>' +
        '</Relationships>');

      addXml('ppt/notesMasters/notesMaster1.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<p:notesMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">' +
        '<p:cSld><p:bg><p:bgRef idx="1001"><a:schemeClr val="bg1"/></p:bgRef></p:bg><p:spTree>' +
        '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>' +
        '</p:spTree></p:cSld>' +
        '<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>' +
        '</p:notesMaster>');

      addXml('ppt/notesMasters/_rels/notesMaster1.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/>' +
        '</Relationships>');

      for (var i3 = 1; i3 <= n; i3++) {
        var row = rows[i3 - 1];
        addXml('ppt/slides/slide' + i3 + '.xml', slideXml(row, SLIDE_W, SLIDE_H));
        addXml('ppt/slides/_rels/slide' + i3 + '.xml.rels',
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>' +
          '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesSlide" Target="../notesSlides/notesSlide' + i3 + '.xml"/>' +
          '</Relationships>');
        addXml('ppt/notesSlides/notesSlide' + i3 + '.xml', notesSlideXml(row.illustration));
        addXml('ppt/notesSlides/_rels/notesSlide' + i3 + '.xml.rels',
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesMaster" Target="../notesMasters/notesMaster1.xml"/>' +
          '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="../slides/slide' + i3 + '.xml"/>' +
          '</Relationships>');
      }

      addXml('docProps/core.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
        '<dc:title>' + escapeXml(title || 'Untitled Picture Book') + '</dc:title>' +
        '<dc:creator>Book Dummy</dc:creator>' +
        '</cp:coreProperties>');

      addXml('docProps/app.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
        '<Application>Book Dummy</Application><Slides>' + n + '</Slides>' +
        '</Properties>');

      return makeZip(files);
    }

    function downloadBlob(filename, bytes) {
      var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    exportBtn.addEventListener('click', function () {
      exportBtn.disabled = true;
      setExportStatus('Preparing file…', true);

      try {
        var pptxBytes = buildPptx(state.title, state.rows, state.trimSize);
        var filename = slugify(state.title) + '.pptx';

        var useClaudeDownloads = typeof window.claude !== 'undefined' && typeof window.claude.use === 'function';
        if (useClaudeDownloads) {
          window.claude.use('downloads').then(function (downloads) {
            if (downloads) {
              return downloads.save({ filename: filename, data: pptxBytes }).then(function () {
                setExportStatus('Saved ' + filename + ' — in Google Slides, use File → Import slides, or open it from Drive.', true);
              });
            }
            downloadBlob(filename, pptxBytes);
            setExportStatus('Downloaded ' + filename + ' — in Google Slides, use File → Import slides, or open it from Drive.', true);
          }).catch(function () {
            downloadBlob(filename, pptxBytes);
            setExportStatus('Downloaded ' + filename + ' — in Google Slides, use File → Import slides, or open it from Drive.', true);
          }).then(function () {
            exportBtn.disabled = false;
          });
        } else {
          downloadBlob(filename, pptxBytes);
          setExportStatus('Downloaded ' + filename + ' — in Google Slides, use File → Import slides, or open it from Drive.', true);
          exportBtn.disabled = false;
        }
      } catch (err) {
        setExportStatus('Couldn’t export: ' + (err && err.message ? err.message : 'unknown error'));
        exportBtn.disabled = false;
      }
    });
  })();
</script>
