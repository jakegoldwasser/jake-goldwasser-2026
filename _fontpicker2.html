<!DOCTYPE html>
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Hanken+Grotesk:wght@800&family=Familjen+Grotesk:wght@700&family=Chivo:wght@900&family=Sora:wght@700&family=IBM+Plex+Sans:wght@700&family=Schibsted+Grotesk:wght@800&display=swap" rel="stylesheet">
<style>
  body { background:#fff; margin:0; padding:40px; }
  .row { display:flex; align-items:baseline; gap:24px; padding:22px 0; border-bottom:1px solid #ddd; }
  .label { font-family: sans-serif; font-size:13px; color:#888; width:190px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.08em;}
  .sample { font-size:44px; color:#E5007D; letter-spacing:-0.01em; text-transform:lowercase; }
  .f1 { font-family: 'Space Grotesk', sans-serif; font-weight:700; }
  .f2 { font-family: 'Hanken Grotesk', sans-serif; font-weight:800; }
  .f3 { font-family: 'Familjen Grotesk', sans-serif; font-weight:700; }
  .f4 { font-family: 'Chivo', sans-serif; font-weight:900; }
  .f5 { font-family: 'Sora', sans-serif; font-weight:700; }
  .f6 { font-family: 'IBM Plex Sans', sans-serif; font-weight:700; }
  .f7 { font-family: 'Schibsted Grotesk', sans-serif; font-weight:800; }
</style>
</head>
<body>
  <div class="row"><div class="label">1. Space Grotesk (your pick, baseline)</div><div class="sample f1">Jake Goldwasser</div></div>
  <div class="row"><div class="label">2. Hanken Grotesk</div><div class="sample f2">Jake Goldwasser</div></div>
  <div class="row"><div class="label">3. Familjen Grotesk</div><div class="sample f3">Jake Goldwasser</div></div>
  <div class="row"><div class="label">4. Chivo Black</div><div class="sample f4">Jake Goldwasser</div></div>
  <div class="row"><div class="label">5. Sora</div><div class="sample f5">Jake Goldwasser</div></div>
  <div class="row"><div class="label">6. IBM Plex Sans</div><div class="sample f6">Jake Goldwasser</div></div>
  <div class="row"><div class="label">7. Schibsted Grotesk</div><div class="sample f7">Jake Goldwasser</div></div>
</body></html>
