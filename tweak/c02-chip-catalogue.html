<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Jake Goldwasser — Chip Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="combo.css">
<style>
/* C02 · Chip Catalogue — Catalogue × Swatch.
   Swatch's quiet header and chip-strip wordmark over Catalogue's primaries and cards; filter pills carry a chip dot.
   Structure and the Tweaks panel live in combo.css / combo.js; this page
   picks the type and the combination. */
:root { --mark: "Zilla Slab", Georgia, serif; --display: "Lora", Georgia, serif; --text: "Inter", "Helvetica Neue", Arial, sans-serif; --mark-w: 700; }
</style>
</head>
<body>
<script src="data.js"></script>
<script src="site.js"></script>
<script src="combo.js"></script>
<script>
Combo({"header": "quiet", "mark": "chips", "nav": "ink", "lede": "serif", "me": "split", "feature": "plate", "extra": "card4", "words": "cards", "filter": "dots", "dots": true, "pressed": "color", "pics": "band", "palettes": ["primaries", "earth", "vermeer", "bauhaus", "spring"], "defaults": {"bw": 3, "r": 0, "gap": 22, "pad": 20}});
</script>
<script src="../selection-highlight.js" data-color="#e8e2d0" defer></script>
</body>
</html>
