/* C06 · Vermeer Catalogue — Catalogue × Swatch.
   Catalogue's layout set in Caslon and Vermeer's lapis and lead-tin yellow, with Swatch's chip bands under each picture.
   Structure and the Tweaks panel live in combo.css / combo.js; this page
   picks the type and the combination. */
:root { --mark: "Libre Caslon Display", Georgia, serif; --display: "Libre Caslon Text", Georgia, serif; --text: "Work Sans", "Helvetica Neue", Arial, sans-serif; --title-w: 400; }
</style>

<body>
<script src="data.js"></script>
<script src="site.js"></script>
<script src="combo.js"></script>
<script>
Combo({"header": "band", "mark": "underline", "nav": "color", "lede": "serif", "me": "split", "feature": "tab", "extra": "lately", "words": "cards", "filter": "bernie", "pressed": "color", "pics": "band", "palettes": ["vermeer", "earth", "primaries", "newsprint", "spring"], "defaults": {"bw": 2, "r": 0, "gap": 22, "pad": 22}});
</script>
<script src="../selection-highlight.js" data-color="#e8e2d0" defer></script>
