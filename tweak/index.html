<style>
/* /tweak/: Jake's private sandbox of site designs (not linked from the
   site, not indexed). Concept: a plain contents page, ink on off-white,
   so the designs it lists do the talking. */
:root { --paper: #fbfaf7; --ink: #1b1820; --ink-soft: #625d68; --line: #dcd8de; --tint: #ece9e2;
  --display: "Libre Caslon Display", "Big Caslon", Georgia, serif; --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding: clamp(32px, 7vw, 72px) clamp(16px, 4vw, 32px) 56px; }
h1 { font: 400 clamp(40px, 7vw, 64px)/1 var(--display); margin: 0 0 28px; }
ol { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--ink); }
li { border-bottom: 1px solid var(--line); }
a { display: flex; align-items: baseline; gap: 18px; padding: 16px 4px; color: inherit; text-decoration: none; transition: background 0.15s; }
a:hover { background: var(--tint); }
h2 { font: 600 12px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin: 56px 0 12px; }
.other .name { font-size: clamp(19px, 2.6vw, 22px); }
.other a { padding-block: 11px; }
.num { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.name { font: 400 clamp(24px, 3.4vw, 30px)/1.1 var(--display); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
