<style>
/* C07 · Bauhaus Block — Catalogue × Swatch.
   The loudest mix: heavy lines, tight gaps, chip-block cards and a chip wordmark in flat Bauhaus primaries.
   Structure and the Tweaks panel live in combo.css / combo.js; this page
   picks the type and the combination. */
:root { --mark: "Archivo", "Helvetica Neue", Arial, sans-serif; --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --text: "Archivo", "Helvetica Neue", Arial, sans-serif; --mark-w: 800; --mark-ls: -0.02em; --lede-w: 700; --title-w: 800; }
</style>
</head>
<body>
<script src="data.js"></script>
<script src="site.js"></script>
<script src="combo.js"></script>
<script>
Combo({"header": "band", "mark": "chips", "nav": "color", "lede": "sans", "me": "split", "feature": "tab", "extra": "card4", "words": "cards", "cards": "block", "filter": "dots", "dots": true, "pressed": "color", "pics": "hover", "palettes": ["bauhaus", "primaries", "riso", "newsprint", "spring", "earth"], "defaults": {"bw": 4, "r": 0, "gap": 14, "pad": 18, "marquee": false}});
</script>
<script src="../selection-highlight.js" data-color="#e8e2d0" defer></script>
</body>
