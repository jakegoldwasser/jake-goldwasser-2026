/* C04 · Slab Shelves — Catalogue × Swatch.
   Catalogue's header and slab type with Swatch's color-headed shelves for Words; the bio sits over a short fact list.
   Structure and the Tweaks panel live in combo.css / combo.js; this page
   picks the type and the combination. */
:root { --mark: "Zilla Slab", Georgia, serif; --display: "Zilla Slab", Georgia, serif; --text: "Inter", "Helvetica Neue", Arial, sans-serif; --mark-w: 700; }
</style>
</head>
<body>
<script src="data.js"></script>
<script src="site.js"></script>
<script src="combo.js"></script>
<script>
Combo({"header": "band", "mark": "underline", "nav": "color", "lede": "sans", "me": "split", "feature": "tab", "facts": true, "extra": "none", "words": "shelves", "filter": "bernie", "pressed": "color", "pics": "hover", "palettes": ["newsprint", "primaries", "vermeer", "earth", "spring"], "defaults": {"bw": 3, "r": 0, "gap": 22, "pad": 20, "marquee": false}});
</script>
<script src="../selection-highlight.js" data-color="#e8e2d0" defer></script>
