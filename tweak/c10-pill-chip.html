<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
<title>Jake Goldwasser — Pill & Chip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="combo.css">
<style>
/* C10 · Pill & Chip — Catalogue × Swatch.
   An even split: Catalogue's tabbed cards and color nav, Swatch's chip wordmark, swatch card and chip-dot filter, rounded corners.
   Structure and the Tweaks panel live in combo.css / combo.js; this page
   picks the type and the combination. */
:root { --mark: "Zilla Slab", Georgia, serif; --display: "Zilla Slab", Georgia, serif; --text: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mark-w: 700; }
</style>
</head>
<body>
<script src="data.js"></script>
<script src="site.js"></script>
<script src="combo.js"></script>
<script>
Combo({"header": "quiet", "mark": "chips", "nav": "color", "lede": "sans", "me": "split", "feature": "tab", "extra": "card4", "words": "cards", "filter": "dots", "dots": true, "pressed": "color", "pics": "band", "palettes": ["garden", "primaries", "earth", "vermeer", "spring"], "defaults": {"bw": 2, "r": 14, "gap": 22, "pad": 22}});
</script>
<script src="../selection-highlight.js" data-color="#e8e2d0" defer></script>
</body>
</html>
