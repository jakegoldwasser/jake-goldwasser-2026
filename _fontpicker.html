<!DOCTYPE html>
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Bebas+Neue&family=Big+Shoulders+Display:wght@800&family=Libre+Franklin:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#fff; margin:0; padding:40px; }
  .row { display:flex; align-items:baseline; gap:24px; padding:22px 0; border-bottom:1px solid #ddd; }
  .label { font-family: sans-serif; font-size:13px; color:#888; width:190px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.08em;}
  .sample { font-size:44px; color:#E5007D; letter-spacing:-0.01em; }
  .f1 { font-family: 'Archivo Black', sans-serif; }
  .f2 { font-family: 'Anton', sans-serif; text-transform:uppercase; }
  .f3 { font-family: 'Bebas Neue', sans-serif; font-size:56px; text-transform:uppercase; letter-spacing:0.02em; }
  .f4 { font-family: 'Big Shoulders Display', sans-serif; font-weight:800; text-transform:uppercase; }
  .f5 { font-family: 'Libre Franklin', sans-serif; font-weight:900; }
  .f6 { font-family: 'Space Grotesk', sans-serif; font-weight:700; }
</style>
</head>
<body>
  <div class="row"><div class="label">1. Archivo Black</div><div class="sample f1">Jake Goldwasser</div></div>
  <div class="row"><div class="label">2. Anton</div><div class="sample f2">Jake Goldwasser</div></div>
  <div class="row"><div class="label">3. Bebas Neue</div><div class="sample f3">Jake Goldwasser</div></div>
  <div class="row"><div class="label">4. Big Shoulders Display</div><div class="sample f4">Jake Goldwasser</div></div>
  <div class="row"><div class="label">5. Libre Franklin Black</div><div class="sample f5">Jake Goldwasser</div></div>
  <div class="row"><div class="label">6. Space Grotesk Bold (current family, heavier)</div><div class="sample f6">Jake Goldwasser</div></div>
</body></html>
