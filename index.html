<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake Goldwasser — Writer, Cartoonist, Translator</title>
<meta name="description" content="Jake Goldwasser writes poems, draws cartoons for the New Yorker, and translates from Dutch and Ladino. He lives and teaches in New York.">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BioRhyme:wght@800&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/combo.css?v=1">
<style>
/* jake-goldwasser.com — the Bauhaus Block design from /tweak/ (c07).
   Concept: the Bauhaus Block layout (heavy lines, tight gaps, a big
   BioRhyme wordmark) in the Spring colorway: pink, sage, sky and honey
   on warm off-white, with green-charcoal ink.
   Me, Words and Pictures are views of this one page (#me, #words,
   #pictures); structure is in site/combo.css and site/combo.js, content
   in site/data.js. Settings are fixed here (no Tweaks panel); Pictures
   gets its own, roomier spacing. */
:root {
  --mark: "BioRhyme", "Rockwell", Georgia, serif;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --text: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mark-w: 800; --mark-ls: -0.01em; --lede-w: 700; --title-w: 800;
}
/* the wordmark is the most expressive thing on the page, so it's big */
.wordmark { font-size: clamp(1.6rem, 4.2vw, 2.9rem); }
</style>
</head>
<body>
<script src="site/data.js?v=1"></script>
<script src="site/site.js?v=1"></script>
<script src="site/combo.js?v=2"></script>
<script>
Combo({
  panel: false, dog: "dog.svg",
  header: "band", mark: "chips", nav: "color", lede: "sans", me: "split", feature: "tab",
  more: true, extra: "recent",
  words: "cards", cards: "block", filter: "dots", dots: true, pressed: "color", pics: "hover",
  palettes: ["spring"],
  defaults: { bw: 4, r: 0, gap: 14, pad: 18, marquee: false,
    // the pictures get more room than the rest of the site
    views: { pictures: { own: true, gap: 40 } } }
});
</script>
<script src="/selection-highlight.js?v=1" data-color="#f8e3e5" defer></script>
</body>
</html>
