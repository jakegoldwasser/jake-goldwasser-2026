<svg class="bernie" viewBox="0 0 120 66" width="82" height="45" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18,34 C8,30 3,22 4,12 C5,9 8,8 10,10 C10,18 13,26 20,32 Z"/>
    <rect x="14" y="22" width="56" height="26" rx="13"/>
    <circle cx="82" cy="23" r="16"/>
    <g class="leg-back"><rect x="19" y="42" width="7" height="19" rx="3.5"/><rect x="28" y="43" width="7" height="18" rx="3.5"/></g>
    <g class="leg-front"><rect x="63" y="42" width="7" height="19" rx="3.5"/><rect x="72" y="43" width="7" height="18" rx="3.5"/></g>
  </g>

  <g fill="#131313">
    <path d="M18,34 C8,30 3,22 4,12 C5,9 8,8 10,10 C10,18 13,26 20,32 Z"/>
    <rect x="14" y="22" width="56" height="26" rx="13"/>
    <circle cx="82" cy="23" r="16"/>
    <g class="leg-back"><rect x="19" y="42" width="7" height="19" rx="3.5"/><rect x="28" y="43" width="7" height="18" rx="3.5"/></g>
    <g class="leg-front"><rect x="63" y="42" width="7" height="19" rx="3.5"/><rect x="72" y="43" width="7" height="18" rx="3.5"/></g>
  </g>

  <!-- ear drawn on top with its own white outline, so it reads as separate from the head -->
  <path d="M78,9 C62,6 53,22 62,40 C70,35 77,25 79,15 C79,12 79,10 78,9 Z" fill="#131313" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- white muzzle with its own black outline -->
  <ellipse cx="97" cy="27" rx="10" ry="7" fill="#ffffff" stroke="#131313" stroke-width="1.8"/>

  <!-- paws, outlined so they show up on white backgrounds -->
  <g class="leg-back">
    <ellipse cx="22.5" cy="61" rx="4.5" ry="2.6" fill="#ffffff" stroke="#131313" stroke-width="1"/>
    <ellipse cx="31.5" cy="61.5" rx="4.5" ry="2.6" fill="#ffffff" stroke="#131313" stroke-width="1"/>
  </g>
  <g class="leg-front">
    <ellipse cx="66.5" cy="61" rx="4.5" ry="2.6" fill="#ffffff" stroke="#131313" stroke-width="1"/>
    <ellipse cx="75.5" cy="61.5" rx="4.5" ry="2.6" fill="#ffffff" stroke="#131313" stroke-width="1"/>
  </g>

  <!-- white-tipped tail, outlined so it shows up on white backgrounds -->
  <path d="M4,12 C5,9 8,8 10,10 C9.5,13 8.5,16 7,18 C5,16 4,14 4,12 Z" fill="#ffffff" stroke="#131313" stroke-width="1"/>

  <!-- black nose -->
  <circle cx="107" cy="26" r="3.4" fill="#131313"/>
  <circle cx="88" cy="18" r="2.1" fill="#ffffff"/>
  <path d="M83,13 Q87,9.5 91,12" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M92,34 Q97,40 102,34" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M96,36 C95,42 99,45 101,40 C101,37 98,35 96,36 Z" fill="#ff8fa8" stroke="#131313" stroke-width="1"/>
</svg>
