<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-2 -8 44 44">
  <g transform="rotate(135 20.5 15)">
    <!-- barrel: one continuous yellow body, no eraser, no ferrule, no facet lines -->
    <rect x="2" y="5" width="27" height="20" rx="4" fill="#ffdd00" stroke="#1e0e3f" stroke-width="1.6"/>
    <!-- chisel tip: flat angled felt nib (bevel down to a flat writing edge, not a point) -->
    <polygon points="29,5 39,13 39,19 29,25" fill="#ad9600" stroke="#1e0e3f" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
