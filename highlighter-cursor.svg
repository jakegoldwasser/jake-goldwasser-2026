<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-2 -8 44 44">
  <g transform="rotate(135 20.5 15)">
    <!-- cap: magenta -->
    <rect x="2" y="5" width="9" height="20" rx="4" fill="#E5007D" stroke="#131313" stroke-width="1.6"/>
    <!-- ferrule: cyan -->
    <rect x="11" y="5" width="5" height="20" fill="#00AEEF" stroke="#131313" stroke-width="1.6"/>
    <!-- barrel: yellow -->
    <rect x="16" y="5" width="13" height="20" fill="#FFD400" stroke="#131313" stroke-width="1.6"/>
    <!-- facet lines run parallel to the barrel -->
    <line x1="16" y1="11.7" x2="29" y2="11.7" stroke="#131313" stroke-width="1" opacity="0.35"/>
    <line x1="16" y1="18.3" x2="29" y2="18.3" stroke="#131313" stroke-width="1" opacity="0.35"/>
    <!-- neck: grey plastic collar -->
    <rect x="29" y="5" width="4" height="20" fill="#d8d8d4" stroke="#131313" stroke-width="1.4"/>
    <!-- chisel tip: flat angled felt nib (bevel down to a flat writing edge, not a point) -->
    <polygon points="33,5 39,13 39,19 33,25" fill="#D4FF00" stroke="#131313" stroke-width="1.4" stroke-linejoin="round" fill-opacity="0.92"/>
  </g>
</svg>
